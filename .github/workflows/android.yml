# Builds the Pokt Pal Trusted Web Activity (android/) into an UNSIGNED
# release app bundle and attaches it to a GitHub pre-release.
# Signing happens on the developer's own PC with the upload key, which never
# goes to GitHub. See docs/ANDROID.md.
name: Android app bundle

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned release bundle
        working-directory: android
        # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches missing platforms.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/pokt-pal-unsigned.aab"
      - name: Publish as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          VERSION=$(python3 -c "import json;m=json.load(open('android/twa-manifest.json'));print(f\"{m['appVersionName']}-{m['appVersionCode']}\")")
          TAG="android-$VERSION-$SHORT"
          gh release create "$TAG" pokt-pal-unsigned.aab \
            --target "$GITHUB_SHA" --prerelease \
            --title "Pokt Pal Android $VERSION (unsigned, $SHORT)" \
            --notes "Unsigned app bundle. Sign it with the upload key before uploading to Google Play."
