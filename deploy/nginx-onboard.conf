# Include inside the existing `server { ... }` block for organiccryptoyyc.com
# (HTTPS). Serves the web app at /onboard/ and the API at /onboard/api/.
location = /onboard { return 301 /onboard/; }

location /onboard/api/ {
    proxy_pass http://127.0.0.1:8080/;   # trailing slash strips /onboard/api
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}

location /onboard/ {
    alias /var/www/pokt-onboard/;
    try_files $uri $uri/ /onboard/index.html;
    location ~ (sw\.js|config\.js)$ { add_header Cache-Control "no-cache"; }
}
