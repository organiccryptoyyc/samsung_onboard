    <radialGradient id="pg" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#4fd1ad" stop-opacity=".35"/><stop offset="1" stop-color="#4fd1ad" stop-opacity="0"/></radialGradient>
    <clipPath id="front"><rect x="0" y="108" width="160" height="60"/></clipPath>
