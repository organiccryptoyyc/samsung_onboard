  <ellipse cx="95" cy="82" rx="9" ry="11.5" fill="#fff"/>
  <circle cx="68" cy="85" r="5.5" fill="#0b0e1c"/>
  <circle cx="97" cy="85" r="5.5" fill="#0b0e1c"/>
  <circle cx="70" cy="82" r="2" fill="#fff"/>
